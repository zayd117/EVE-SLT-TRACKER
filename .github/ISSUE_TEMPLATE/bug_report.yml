name: Bug report
description: Something the tracker did wrong, missed, or got stuck on.
labels: [bug]
body:

  - type: markdown
    attributes:
      value: |
        Before filing: open the browser console (F12 -> Console) on the source
        page and filter on `[EVE SLT+JBOG TRACKER]`. Everything the tracker prints is
        prefixed with that, so it is easy to pull out.

  - type: input
    id: version
    attributes:
      label: Tracker version
      description: >
        The version in the EVE SLT+JBOG TRACKER panel title, console startup
        banner, or Tampermonkey dashboard.
      placeholder: "2.0.1"
    validations:
      required: true

  - type: dropdown
    id: source
    attributes:
      label: Source page
      options:
        - EVE SLT rack page
        - Lion King collector
        - Ramses JBOG dashboard
        - TestView navigation
    validations:
      required: true

  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Edge
        - Chrome
        - Firefox
        - Other
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected to happen
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What actually happened
      description: >
        Include the row/slot, operation, and whether the area's Enabled or
        Notifs control was on. For SLT, include the color transition.
        If a false alert fired, include its phase and timing.
    validations:
      required: true

  - type: textarea
    id: console
    attributes:
      label: Console output
      description: >
        Any red text, plus the `[EVE SLT+JBOG TRACKER]` lines around the time of the
        problem.
      render: text

  - type: textarea
    id: health
    attributes:
      label: Refresh diagnostics
      description: >
        Enable the Dev checkbox. For SLT, include Refresh diagnostics.
        For Lion King/Ramses, use Copy source diagnostics in Monitoring status.
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: Sanity checks
      options:
        - label: I have installed the current file from the repository (version-preserving 2.0.1 updates require a manual update)
        - label: I have hard-refreshed the page (Ctrl+Shift+R)
